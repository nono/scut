name: release

on:
  push:
    tags: ["v*"]

permissions: {}

# A new tag waits for the running release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No caches: a poisoned cache must not get into a release.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache: false
      # setup-node v5+ caches npm by default when package.json names npm as packageManager.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Lint and test
        env:
          CI: "true"
        run: make lint test
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -eu
          mkdir -p dist/pkg
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o dist/pkg/scut ./cmd/scut
          cp README.md dist/pkg/
          if [ -f LICENSE ]; then cp LICENSE dist/pkg/; fi
          name="scut_${TAG}_linux_amd64.tar.gz"
          tar -C dist/pkg -czf "dist/${name}" .
          (cd dist && sha256sum "${name}" > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" --title "${TAG}" --generate-notes \
            "dist/scut_${TAG}_linux_amd64.tar.gz" dist/checksums.txt
