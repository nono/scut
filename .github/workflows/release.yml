name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Lint and test
        env:
          CI: "true"
        run: make lint test
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -eu
          mkdir -p dist/pkg
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o dist/pkg/scut ./cmd/scut
          cp README.md dist/pkg/
          if [ -f LICENSE ]; then cp LICENSE dist/pkg/; fi
          name="scut_${TAG}_linux_amd64.tar.gz"
          tar -C dist/pkg -czf "dist/${name}" .
          (cd dist && sha256sum "${name}" > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" --title "${TAG}" --generate-notes \
            "dist/scut_${TAG}_linux_amd64.tar.gz" dist/checksums.txt
